<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClickUp Margin Report</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { min-width: 340px; max-width: 380px; }
      .popup-header {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding-bottom: var(--space-3);
        border-bottom: 1px solid var(--border-primary);
        margin-bottom: var(--space-4);
      }
      .popup-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
      }
      .popup-header-text { flex: 1; }
      .popup-header-text h1 { font-size: var(--text-lg); }
      .popup-header-text p { font-size: var(--text-xs); margin: 0; }
      .popup-actions {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-4);
      }
      .popup-actions .btn { flex: 1; }
      .popup-status {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) 0;
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }
      .popup-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success-500);
      }
      .popup-status-dot.inactive { background: var(--text-tertiary); }
      .popup-status-dot.error { background: var(--danger-500); }
      .quick-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid var(--border-primary);
      }
      .quick-metric-label { font-size: var(--text-xs); color: var(--text-secondary); }
      .quick-metric-value { font-size: var(--text-xl); font-weight: var(--font-bold); }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="popup-header">
        <img class="popup-icon" src="icons/icon-48.png" alt="" />
        <div class="popup-header-text">
          <h1>Margin Report</h1>
          <p id="rangeLabel">14-day lookback</p>
        </div>
        <button id="openOptions" type="button" class="btn btn-secondary btn-sm" title="Settings">Settings</button>
      </div>

      <div id="notClickUpAlert" class="alert alert-warning hidden">
        <span class="alert-icon">⚠️</span>
        <div class="alert-content">
          <p class="alert-title">Open ClickUp</p>
          <p class="alert-description">Navigate to app.clickup.com first</p>
        </div>
      </div>

      <div id="statusSection">
        <div class="popup-status">
          <span id="statusDot" class="popup-status-dot"></span>
          <span id="statusText">Connected to ClickUp</span>
        </div>
      </div>

      <div class="popup-actions">
        <button id="runReport" type="button" class="btn btn-primary">Run Report</button>
        <button id="viewReport" type="button" class="btn btn-secondary hidden">View</button>
      </div>

      <div id="quickMetrics" class="quick-metrics hidden">
        <div>
          <div class="quick-metric-label">Revenue</div>
          <div id="revenue" class="quick-metric-value">$0</div>
        </div>
        <div>
          <div class="quick-metric-label">Margin</div>
          <div id="margin" class="quick-metric-value">0%</div>
        </div>
      </div>

      <div id="warningBadge" class="hidden" style="margin-top: var(--space-3);">
        <span class="badge badge-warning">
          <span id="warningCount">0</span> warnings
        </span>
      </div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
